<div class="blockContainer" id="cvBody"></div>
<style>
	@media print {
		body {
			margin: 0;
		}
		@page {
			margin: 0.25in;
			size: letter;
		}
	}
	body {
		margin: auto;
	}
	* {
		font-family: "Trebuchet MS", "Lucida Sans Unicode", "Lucida Grande", "Lucida Sans", Arial, sans-serif;
	}
	a {
		color: #0078d7;
	}
	code {
		font-family: monospace;
	}
	header {
		text-align: center;
		margin: 0;
	}
	header > h1 {
		margin: 0;
	}
	header > sub {
		display: block;
		font-size: 12px;
		margin: 0;
		margin-top: 4px;
		margin-bottom: -20px;
		font-style: italic;
		color: #aaa;
	}
	header > div {
		margin: auto;
		display: grid;
		justify-content: center;
		grid-template-columns: repeat(2, min-content);
	}
	header > div > a {
		margin: 0;
		margin-left: 8px;
		margin-right: 8px;
		display: block;
	}
	.blockContainer {
		display: flex;
		flex-wrap: wrap;
		justify-content: center;
		gap: 8px;
	}
	.blockContainer > .category {
		text-align: right;
		border-bottom: 2px dotted #aaa;
		padding: 0;
		margin: 0;
		margin-top: 16px;
		flex-basis: 100%;
		height: fit-content;
		break-inside: avoid;
		break-after: avoid;
	}
	:root {
		--box-bullet-leader: hsl(0, 0%, 30%);
		--background: hsla(0, 0%, 97%);
	}
	.education {
		--box-bullet-leader: hsl(225, 100%, 30%);
		--background: hsl(225, 100%, 97%);
	}
	.projects {
		--box-bullet-leader: hsl(90, 70%, 30%);
		--background: hsl(90, 70%, 97%);
	}
	.work {
		--box-bullet-leader: hsl(300, 70%, 30%);
		--background: hsl(300, 70%, 97%);
	}
	.blockContainer > .block {
		width: min-content;
		height: min-content;
		background: var(--background);
		border: 2px solid color-mix(in hsl, var(--box-bullet-leader) 10%, transparent);
		/*
		border: #eee solid 4px;
		border-top: 0;
		border-left: 0;
		*/
		box-sizing: content-box;
		border-radius: 8px;
		padding: 8px;
		break-inside: avoid;
		flex-grow: 1;
	}
	.blockContainer > .block > div {
		font-size: 16px;
		margin-left: 8px;
		text-wrap-mode: nowrap;
		width: fit-content;
	}
	.blockContainer > .block > div::before {
		content: "";
		position: absolute;
		width: 6px;
		height: 6px;
		background-color: var(--box-bullet-leader);
		border-radius: 6px;
		margin-left: -10px;
		margin-top: 5px;
		box-sizing: border-box;
	}
	.blockContainer b,
	.blockContainer strong {
		color: var(--box-bullet-leader);
	}
	.blockContainer > .block > li {
		stroke-linecap: round;
		font-size: 12px;
		border-left: var(--box-bullet-leader) solid 2px;
		padding-left: 13px;
		padding-top: 7px;
		list-style-type: none;
	}
	.blockContainer > .block > li:empty {
		border-bottom: color-mix(in hsl, var(--box-bullet-leader) 10%, transparent) 2px dashed;
	}
	.blockContainer > .block > li:empty::before {
		content: none;
		border: none;
	}
	.blockContainer > .block > li::before {
		display: list-item;
		content: "";
		position: absolute;
		border-bottom: var(--box-bullet-leader) 2px solid;
		border-left: var(--box-bullet-leader) 2px solid;
		width: 10px;
		height: 28px;
		background-color: transparent;
		border-bottom-left-radius: 6px;
		stroke-linecap: round;
		margin-left: -15px;
		margin-top: -20px;
		box-sizing: border-box;
	}
	.blockContainer > .block > li > ul {
		margin: 0;
		padding: 0;
	}
	.blockContainer > .block > li > ul > li {
		stroke-linecap: round;
		font-size: 12px;
		padding-left: 7px;
		padding-top: 7px;
		list-style-type: none;
	}
	.blockContainer > .block > li > ul > li::before {
		display: list-item;
		content: "";
		position: absolute;
		border-bottom: var(--box-bullet-leader) 2px solid;
		border-left: none;
		width: 12px;
		height: 28px;
		background-color: transparent;
		border-bottom-left-radius: 6px;
		margin-left: -17px;
		margin-top: -20px;
		box-sizing: border-box;
	}
	.blockContainer > .block > li:not(:has(> ul:empty)) {
		border-left: color-mix(in hsl, var(--box-bullet-leader) 20%, transparent) solid 2px;
	}
	.blockContainer > .block > li:last-child {
		border-left: transparent solid 2px !important;
	}
	.blockContainer > .block.skills {
		padding-left: 24px;
		display: flex;
		flex-wrap: wrap;
		justify-content: space-between;
	}
	.blockContainer > .block.skills > div {
		font-size: 14px;
		flex-basis: 144px;
	}
</style>
<script>
	const LISTED_CATEGORIES = {
		education: "Education",
		skills: "Listed Skills",
		work: "Employment",
		projects: "Projects & Research",
	};

	function loadFile(path) {
		try {
			const request = new XMLHttpRequest();
			request.open("GET", path, false);
			request.send(null);
			if (request.status === 200) return request.responseText;
		} catch (e) {
			return;
		}
	}

	function splatArray(words) {
		return words
			.toLowerCase()
			.matchAll(/([0-9a-z]+)/gi)
			.map(([e, ..._]) => e);
	}

	function getJobDescription(cvName) {
		const fileData = loadFile(`./${cvName}/_job_desc.txt`) ?? "";
		return new Set(splatArray(fileData));
	}

	function pickBestChoice(jobDescription, choices) {
		let choice;
		for (choice of choices) {
			const words = splatArray(choice);
			const wordExists = words.some((e) => jobDescription.has(e));
			if (!wordExists) continue;
			return [true, choice];
		}
		return [false, choice];
	}

	function collapseChoices(jobDescription, element, item_text = undefined) {
		if (item_text !== undefined) element.innerHTML = item_text;
		// E.g. <choice>first choice|second choice|last choice or default</choice>
		for (const tag of element.querySelectorAll("choice")) {
			const choices = tag.innerText.split("|");
			let [included, choice] = pickBestChoice(jobDescription, choices);
			tag.innerText = choice;
		}
	}

	function scoreElement(jobDescription, element) {
		var score = 0;
		for (var word of splatArray(element.innerHTML)) if (jobDescription.has(word)) score++;
		return score;
	}

	function mapElementsToSort(jobDescription, arr, pred, limit = -1, keepTies = false) {
		var scoresAndElements = arr.map(pred).map((elem, i) => {
			var score = scoreElement(jobDescription, elem);
			return [-1 * score, i, elem];
		});

		scoresAndElements.sort();
		var result = [];

		// Adds the top scoring elements.
		if (keepTies) {
			let scoreThresh = 0;
			for (let [neg_s, i, e] of scoresAndElements) {
				if (neg_s > scoreThresh) break;
				if (i == limit) scoreThresh = neg_s;
				result.push(e);
			}
		} else {
			for (let [neg_s, i, e] of scoresAndElements) {
				result.push(e);
				if (i == limit) break;
			}
		}
		return result;
	}
	function getLimitOfBulletPoints(category, jobDescription) {
		if (!jobDescription.size) return -1;
		switch (LISTED_CATEGORIES[category]) {
			case LISTED_CATEGORIES.projects:
				return 3;
			case LISTED_CATEGORIES.work:
				return 3;
			default:
				return -1;
		}
	}

	function genItemElement(category, itemData, jobDescription) {
		var mainEl = document.createElement("div");
		mainEl.className = `block ${category}`;

		if (LISTED_CATEGORIES[category] == LISTED_CATEGORIES.skills) {
			var skillBlocks = mapElementsToSort(jobDescription, itemData, (data) => {
				var el = document.createElement("div");
				collapseChoices(jobDescription, el, data);
				return el;
			});
			mainEl.append(...skillBlocks);
			return mainEl;
		}

		var [date, title, ...itemData] = itemData;
		var titleEl = document.createElement("div");
		titleEl.innerHTML = `<b>${title}</b> &ndash; ${date}`;
		mainEl.append(titleEl);

		const bulletPointElems = [];
		for (let data of itemData) {
			let dash_index = data.indexOf("-");
			let padded_text = data.slice(dash_index + 1);
			let text = padded_text.trim();

			switch (dash_index) {
				case 0: {
					let el = document.createElement("li");
					collapseChoices(jobDescription, el, text);
					bulletPointElems.push(el);
					if (padded_text !== "") el.appendChild(document.createElement("ul"));
					break;
				}

				case 2: {
					data = data.substring("  -".length);
					let el = document.createElement("li");
					collapseChoices(jobDescription, el, text);
					bulletPointElems.at(-1).lastElementChild.appendChild(el);
				}

				default:
					break;
			}
		}

		var limit = getLimitOfBulletPoints(category, jobDescription);
		mainEl.append(...mapElementsToSort(jobDescription, bulletPointElems, (e) => e, limit, true));
		return mainEl;
	}

	function getLimitOfItems(category, jobDescription) {
		if (!jobDescription.size) return -1;
		switch (LISTED_CATEGORIES[category]) {
			case LISTED_CATEGORIES.projects:
				return 2;
			case LISTED_CATEGORIES.work:
				return 2;
			case LISTED_CATEGORIES.skills:
				return 2;
			default:
				return -1;
		}
	}

	function genCategoryElements(cvName, category, cName) {
		var dataStr = loadFile(`./${cvName}/${category}.txt`);
		var cvData = dataStr.split("\n\n").map((s) => s.split("\n"));

		var categoryEl = document.createElement("div");
		categoryEl.className = `category ${category}`;
		categoryEl.innerText = cName;

		const jobDescription = getJobDescription(cvName);
		var limit = getLimitOfItems(category, jobDescription);
		var itemElements = mapElementsToSort(
			jobDescription,
			cvData,
			(cvItem) => genItemElement(category, cvItem, jobDescription),
			limit,
		);
		return [categoryEl, ...itemElements];
	}

	const cvName = new URLSearchParams(window.location.search).get("cvProfile") ?? loadFile("_current_cv_profile.txt") ?? "cv";
	const bodyEl = document.getElementById("cvBody");

	bodyEl.append(
		...Object.entries(LISTED_CATEGORIES).flatMap(([category, cName]) => genCategoryElements(cvName, category, cName)),
	);

	document.getElementById("date").innerText = new Intl.DateTimeFormat("en-SE", {
		dateStyle: "full",
		timeStyle: "long",
	}).format(new Date());
</script>
